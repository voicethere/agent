name: Release

# Publish @voicethere/agent to npm on tag push.
# Trigger: git tag release/0.1.0 && git push origin refs/tags/release/0.1.0
# Prep: branch release-prep/X.Y.Z → main (see scripts/RELEASE.md)

on:
  push:
    tags: ['release/*']

permissions:
  contents: write
  pull-requests: read

jobs:
  quality:
    name: Test & verify
    uses: ./.github/workflows/test.yml
    with:
      always_run: true

  publish:
    name: Publish to npm
    needs: quality
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          registry-url: https://registry.npmjs.org
          scope: '@voicethere'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Resolve release version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#release/}"
          if [ -z "$VERSION" ]; then
            echo "Could not parse version from tag: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing @voicethere/agent@${VERSION}"

      - name: Check CHANGELOG entry
        run: bash scripts/ci/check-changelog-entry.sh "${{ steps.version.outputs.version }}"

      - run: npm ci

      - name: Set package version
        run: npm version "${{ steps.version.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Check OpenRouter default model
        run: npm run check:openrouter-model

      - name: Build publishable dist
        run: npm run build

      - name: Configure npm registry auth
        run: echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > "$HOME/.npmrc"
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Check whether this version is already on npm
        id: exists
        run: |
          if bash scripts/ci/npm-version-exists.sh @voicethere/agent "${{ steps.version.outputs.version }}"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.exists.outputs.exists != 'true'
        run: npm publish --access public
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Skip publish
        if: steps.exists.outputs.exists == 'true'
        run: echo "already published, skipping"

  verify-and-release:
    name: Verify on registry and create GitHub release
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '26'

      - name: Verify package on registry
        run: bash scripts/ci/wait-for-npm-package.sh @voicethere/agent "${{ needs.publish.outputs.version }}"
        env:
          NPM_REGISTRY_VERIFY_TIMEOUT_SECONDS: 900

      - name: Prepare GitHub release notes
        id: release_notes
        run: |
          BODY_FILE="${RUNNER_TEMP}/release-notes.md"
          bash scripts/changelog-release-body.sh "${{ needs.publish.outputs.version }}" > "$BODY_FILE"
          echo "body_file=$BODY_FILE" >> "$GITHUB_OUTPUT"

      # softprops/action-gh-release updates an existing release, so a re-run is safe.
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ needs.publish.outputs.version }}
          body_path: ${{ steps.release_notes.outputs.body_file }}
          generate_release_notes: false

  mcp-example-image:
    name: Publish MCP example service image
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: services/mcp-example
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/voicethere/mcp-example-service:${{ needs.publish.outputs.version }}
            ghcr.io/voicethere/mcp-example-service:latest
